name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run test suite
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite+aiosqlite:///./test_chain.db
      CHAIN_ID: "7764"
      NETWORK: testnet
      LOG_LEVEL: WARNING
      EPOCH_SECONDS: "15"
      P2P_ENABLED: "false"
      GENESIS_VALIDATORS: ""

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio aiosqlite

      - name: Run tests
        run: pytest -v --tb=short

      - name: Upload coverage (optional)
        if: success()
        run: |
          pip install pytest-cov --quiet
          pytest --cov=chain --cov-report=term-missing -q || true
